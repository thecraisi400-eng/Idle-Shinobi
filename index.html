<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensiones Específicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fondo gris oscuro para que el recuadro negro destaque */
            background-color: #333333; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-medida {
            width: 392px;
            height: 687px;
            background-color: #000000;
            position: relative;
            /* Sombra sutil para diferenciarlo bien del fondo de la página */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .linea-divisoria {
            position: absolute;
            top: 344px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="contenedor-medida">
        <!-- La línea que divide horizontalmente a los 344px de alto -->
        <div class="linea-divisoria"></div>
    </div>

</body>
</html>
