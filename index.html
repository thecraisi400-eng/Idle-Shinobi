    <style>
        /* Gestión de carga de sprites: no modifica el contenedor ni sus dimensiones. */
        #sprite-loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: #111;
            color: #fff;
            font: 16px system-ui, sans-serif;
        }

        #sprite-loading[hidden] {
            display: none;
        }

        #sprite-loading-content {
            width: min(320px, calc(100vw - 40px));
            text-align: center;
        }

        #sprite-loading-bar {
            height: 6px;
            margin-top: 14px;
            overflow: hidden;
            border-radius: 999px;
            background: #333;
        }

        #sprite-loading-progress {
            width: 0;
            height: 100%;
            background: #fff;
            transition: width 120ms linear;
        }

        body {
            /* Fondo gris oscuro para que el recuadro negro destaque */
            background-color: #333333; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-medida {
            width: 392px;
            height: 687px;
            background-color: #000000;
            position: relative;
            /* Sombra sutil para diferenciarlo bien del fondo de la página */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        /* El lienzo mide exactamente el cuadro superior: 392 × 344 px. */
        .escenario-superior {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            display: block;
            width: 392px;
            height: 344px;
            image-rendering: pixelated;
        }

        .linea-divisoria {
            position: absolute;
            z-index: 1;
            top: 344px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
        }

<body>

    <div id="sprite-loading" role="status" aria-live="polite">
        <div id="sprite-loading-content">
            <div id="sprite-loading-label">Cargando recursos…</div>
            <div id="sprite-loading-bar" aria-hidden="true">
                <div id="sprite-loading-progress"></div>
            </div>
        </div>
    </div>

    <div class="contenedor-medida">
        <!-- Recorte de escenarios1.webp: origen (11, 9), fin exclusivo (403, 353). -->
        <canvas
            id="escenario-superior"
            class="escenario-superior"
            width="392"
            height="344"
            aria-label="Escenario superior"
        ></canvas>
        <!-- La línea que divide horizontalmente a los 344px de alto -->
        <div class="linea-divisoria"></div>
    </div>

    <script>
        // Administrador aislado: solo conoce las 10 hojas de sprites y no toca la lógica del juego.
        (() => {
            const root = 'assets/sprites/';
            const initial = ['escenarios1.webp', 'personaje1.webp', 'personaje2.webp'];
            const remaining = [
                'escenarios2.webp', 'escenarios3.webp',
                'personaje3.webp', 'personaje4.webp', 'personaje5.webp',
                'personaje6.webp', 'personaje7.webp'
            ];
            const loaded = new Map();
            const loading = new Map();
            const label = document.getElementById('sprite-loading-label');
            const progress = document.getElementById('sprite-loading-progress');
            const screen = document.getElementById('sprite-loading');
            let completed = 0;
            const total = initial.length + remaining.length;

            function updateProgress() {
                completed += 1;
                const percent = Math.round((completed / total) * 100);
                progress.style.width = `${percent}%`;
                label.textContent = `Cargando recursos… ${percent}%`;
            }

            // Orden de resolución de cada hoja:
            //   1. Copia embebida en el propio HTML (data: URI)  -> funciona sin servidor y sin red.
            //   2. fetch() del archivo suelto                     -> solo si alguien quitó el embebido.
            function embeddedSource(name) {
                const store = window.EMBEDDED_ASSETS;
                const entry = store && store.sheets ? store.sheets[name] : null;
                return entry && entry.dataUri ? entry.dataUri : null;
            }

            function bytesFromDataUri(dataUri) {
                const header = 'base64,';
                const comma = dataUri.indexOf(header);
                if (comma === -1) return null;
                const raw = dataUri.slice(comma + header.length);
                const binary = atob(raw);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
                return bytes;
            }

            function decode(source, name) {
                const asBitmap = (bytes) => createImageBitmap(new Blob([bytes], { type: 'image/webp' }));
                const asImage = (bytes) => new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(new Blob([bytes], { type: 'image/webp' }));
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error(`No se pudo decodificar ${name}`));
                    image.src = url;
                });
                const pick = ('createImageBitmap' in window) ? asBitmap : asImage;

                if (typeof source === 'string') {
                    // Camino offline: cero peticiones de red.
                    const bytes = bytesFromDataUri(source);
                    if (!bytes) return Promise.reject(new Error(`Datos embebidos inválidos para ${name}`));
                    return pick(bytes);
                }
                // Camino de respaldo: archivo en disco.
                return source
                    .then(response => {
                        if (!response.ok) throw new Error(`No se pudo cargar ${name}`);
                        return response.arrayBuffer();
                    })
                    .then(buffer => pick(new Uint8Array(buffer)));
            }

            function loadSheet(name) {
                if (loaded.has(name)) return Promise.resolve(loaded.get(name));
                if (loading.has(name)) return loading.get(name);

                const embedded = embeddedSource(name);
                const task = decode(embedded || fetch(root + name), name)
                    .then(image => {
                        loaded.set(name, image);
                        loading.delete(name);
                        updateProgress();
                        return image;
                    })
                    .catch(error => {
                        loading.delete(name);
                        throw error;
                    });

                loading.set(name, task);
                return task;
            }

            async function loadInOrder(list) {
                for (const name of list) await loadSheet(name);
            }

            function idleLoad(list) {
                const next = list.shift();
                if (!next) return;
                const run = () => loadSheet(next).catch(console.error).finally(() => idleLoad(list));
                if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 1000 });
                else setTimeout(run, 50);
            }

            function drawUpperScenario(image) {
                // Coordenadas solicitadas de la hoja: [11, 403) × [9, 353).
                // El extremo derecho e inferior son exclusivos, como drawImage(),
                // por lo que el recorte conserva exactamente 392 × 344 píxeles.
                const sourceX = 11;
                const sourceY = 9;
                const sourceWidth = 403 - sourceX;
                const sourceHeight = 353 - sourceY;
                const canvas = document.getElementById('escenario-superior');
                const context = canvas.getContext('2d', { alpha: false });

                if (!context) throw new Error('No se pudo preparar el escenario superior.');
                context.imageSmoothingEnabled = false;
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(
                    image,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, canvas.width, canvas.height
                );
            }

            // API pública mínima para el futuro renderizador: no reemplaza ninguna función existente.
            window.spriteManager = {
                get(name) { return loaded.get(name) || null; },
                load(name) { return loadSheet(name); },
                release(name) {
                    const image = loaded.get(name);
                    if (!image) return false;
                    if (typeof image.close === 'function') image.close();
                    loaded.delete(name);
                    return true;
                },
                has(name) { return loaded.has(name); }
            };

            loadInOrder(initial)
                .then(() => {
                    // Usa la instancia ya precargada: no crea ni muestra la hoja completa.
                    drawUpperScenario(loaded.get('escenarios1.webp'));
                    screen.hidden = true;
                    idleLoad(remaining.slice());
                })
                .catch(error => {
                    label.textContent = 'No se pudieron cargar los recursos.';
                    console.error(error);
                });
        })();
    </script>

    <script>
        // Service worker opcional: solo se registra en un contexto seguro (http/https/localhost).
        // Abriendo el archivo con doble clic (file://) los navegadores lo bloquean, y ahí tampoco
        // hace falta: los sprites ya van dentro del HTML.
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service worker registrado: el juego queda disponible offline.'))
                .catch(error => console.warn('SW no registrado:', error));
        }
    </script>

</body>
</html>
