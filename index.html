<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensiones Específicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fondo gris oscuro para que el recuadro negro destaque */
            background-color: #333333; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-medida {
            width: 392px;
            height: 687px;
            background-color: #000000;
            position: relative;
            /* Sombra sutil para diferenciarlo bien del fondo de la página */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .linea-divisoria {
            position: absolute;
            top: 344px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            /* La divisoria siempre queda por encima del escenario dibujado. */
            z-index: 2;
        }

        /*
         * Lienzo del escenario: ocupa el cuadro superior del contenedor.
         * Sus dimensiones reales (atributos width/height) se fijan desde JS
         * con el tamaño exacto del recorte, para copiar píxel a píxel.
         */
        #lienzo-escenario {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="contenedor-medida">
        <!-- Aquí se dibuja solo el recorte exacto del escenario (cuadro superior). -->
        <canvas id="lienzo-escenario" aria-label="Escenario de la zona 1"></canvas>
        <!-- La línea que divide horizontalmente a los 344px de alto -->
        <div class="linea-divisoria"></div>
    </div>

    <script>
        /*
         * Gestor aislado de hojas de sprites.
         *
         * Coloque los diez archivos WebP en assets/sprites/. La asignación de cada
         * personaje a una zona está reunida en ZONAS para que se pueda ajustar sin
         * tocar el cargador ni la lógica del juego.
         *
         * Este bloque no inicia una carga por sí mismo, por lo que la pantalla actual
         * conserva su comportamiento hasta que el juego invoque entrarEnZona().
         */
        (() => {
            const RUTA_SPRITES = './assets/sprites/';

            const SPRITES = {
                escenarios1: `${RUTA_SPRITES}escenarios1.webp`,
                escenarios2: `${RUTA_SPRITES}escenarios2.webp`,
                escenarios3: `${RUTA_SPRITES}escenarios3.webp`,
                personaje1: `${RUTA_SPRITES}personaje1.webp`,
                personaje2: `${RUTA_SPRITES}personaje2.webp`,
                personaje3: `${RUTA_SPRITES}personaje3.webp`,
                personaje4: `${RUTA_SPRITES}personaje4.webp`,
                personaje5: `${RUTA_SPRITES}personaje5.webp`,
                personaje6: `${RUTA_SPRITES}personaje6.webp`,
                personaje7: `${RUTA_SPRITES}personaje7.webp`
            };

            /*
             * personaje1 se considera el personaje que acompaña al jugador durante
             * toda la partida. Cambie solamente estos arreglos si la distribución
             * real de enemigos o personajes por escenario es distinta.
             */
            const ZONAS = {
                1: ['escenarios1', 'personaje1', 'personaje2', 'personaje3'],
                2: ['escenarios2', 'personaje1', 'personaje4', 'personaje5'],
                3: ['escenarios3', 'personaje1', 'personaje6', 'personaje7']
            };
            const SPRITES_PERSISTENTES = ['personaje1'];

            const cargados = new Map();
            const cargasEnCurso = new Map();
            const zonasPrecargadas = new Set();
            let zonaActiva = null;

            function avisar(tipo, detalle) {
                window.dispatchEvent(new CustomEvent(`sprites:${tipo}`, { detail: detalle }));
            }

            function cargarSprite(nombre) {
                if (!SPRITES[nombre]) {
                    return Promise.reject(new Error(`Sprite desconocido: ${nombre}`));
                }
                if (cargados.has(nombre)) return Promise.resolve(cargados.get(nombre));
                if (cargasEnCurso.has(nombre)) return cargasEnCurso.get(nombre);

                const carga = new Promise((resolver, rechazar) => {
                    const imagen = new Image();
                    imagen.decoding = 'async';
                    imagen.onload = async () => {
                        try {
                            // decode() prepara la imagen antes de que el renderizador la use.
                            if (imagen.decode) await imagen.decode();
                            cargados.set(nombre, imagen);
                            avisar('cargado', { nombre, imagen });
                            resolver(imagen);
                        } catch (error) {
                            rechazar(error);
                        } finally {
                            cargasEnCurso.delete(nombre);
                        }
                    };
                    imagen.onerror = () => {
                        cargasEnCurso.delete(nombre);
                        rechazar(new Error(`No se pudo cargar ${SPRITES[nombre]}`));
                    };
                    imagen.src = SPRITES[nombre];
                });

                cargasEnCurso.set(nombre, carga);
                return carga;
            }

            async function cargarGrupo(nombres) {
                return Promise.all(nombres.map(cargarSprite));
            }

            function liberarNoNecesarios() {
                const conservar = new Set(SPRITES_PERSISTENTES);
                if (zonaActiva !== null) ZONAS[zonaActiva].forEach(nombre => conservar.add(nombre));
                zonasPrecargadas.forEach(zona => ZONAS[zona].forEach(nombre => conservar.add(nombre)));

                cargados.forEach((imagen, nombre) => {
                    if (!conservar.has(nombre)) {
                        // Al eliminar la referencia, el navegador puede recuperar RAM y memoria gráfica.
                        cargados.delete(nombre);
                        avisar('liberado', { nombre });
                    }
                });
            }

            async function entrarEnZona(zona) {
                if (!ZONAS[zona]) throw new Error(`Zona desconocida: ${zona}`);

                // Primero se prepara la nueva zona. La anterior sigue visible si algo falla.
                await cargarGrupo(ZONAS[zona]);
                zonaActiva = zona;
                zonasPrecargadas.delete(zona);
                liberarNoNecesarios();
                avisar('zonaLista', { zona, sprites: ZONAS[zona] });
            }

            async function precargarZona(zona) {
                if (!ZONAS[zona]) throw new Error(`Zona desconocida: ${zona}`);
                if (zona === zonaActiva) return;

                await cargarGrupo(ZONAS[zona]);
                // Solo se conserva una zona futura: así la precarga no crece sin límite.
                zonasPrecargadas.clear();
                zonasPrecargadas.add(zona);
                liberarNoNecesarios();
                avisar('zonaPrecargada', { zona, sprites: ZONAS[zona] });
            }

            function descartarPrecarga(zona) {
                zonasPrecargadas.delete(zona);
                liberarNoNecesarios();
            }

            window.GestorSprites = Object.freeze({
                entrarEnZona,
                precargarZona,
                descartarPrecarga,
                obtener(nombre) { return cargados.get(nombre) || null; },
                estaCargado(nombre) { return cargados.has(nombre); },
                estado() {
                    return Object.freeze({
                        zonaActiva,
                        cargados: [...cargados.keys()],
                        zonasPrecargadas: [...zonasPrecargadas]
                    });
                }
            });
        })();

        /*
         * Escenario de la zona 1.
         *
         * NO se dibuja la imagen completa: se copia únicamente el rectángulo
         * exacto de píxeles indicado en RECORTE_ESCENARIO, sin ningún escalado
         * (1 px de la hoja = 1 px del lienzo). Ese rectángulo mide 392x344,
         * igual que el cuadro superior del contenedor (392 px de ancho y la
         * línea divisoria a los 344 px), así que encaja píxel a píxel.
         */
        (() => {
            const NOMBRE_ESCENARIO = 'escenarios1';

            // Coordenadas (en píxeles) donde está el escenario dentro de
            // assets/sprites/escenarios1.webp. Ajuste solo estos cuatro valores
            // si el recorte cambia de posición en la hoja.
            const RECORTE_ESCENARIO = Object.freeze({
                izquierda: 8,   // Inicio X (borde izquierdo del escenario)
                arriba: 8,      // Inicio Y (borde superior del escenario)
                derecha: 400,   // Fin X (borde derecho del escenario)
                abajo: 352      // Fin Y (borde inferior del escenario)
            });

            const ANCHO = RECORTE_ESCENARIO.derecha - RECORTE_ESCENARIO.izquierda; // 392
            const ALTO = RECORTE_ESCENARIO.abajo - RECORTE_ESCENARIO.arriba;       // 344

            const lienzo = document.getElementById('lienzo-escenario');
            // Tamaño físico del lienzo = tamaño del recorte: copia 1:1 sin escalado.
            lienzo.width = ANCHO;
            lienzo.height = ALTO;
            lienzo.style.width = `${ANCHO}px`;
            lienzo.style.height = `${ALTO}px`;

            const ctx = lienzo.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            function dibujarEscenario() {
                const imagen = window.GestorSprites.obtener(NOMBRE_ESCENARIO);
                if (!imagen) return;

                // Aviso si la hoja fuera más pequeña de lo esperado: el navegador
                // recortaría lo que falte y el resultado quedaría incompleto.
                if (imagen.naturalWidth < RECORTE_ESCENARIO.derecha ||
                    imagen.naturalHeight < RECORTE_ESCENARIO.abajo) {
                    console.warn(
                        `escenarios1.webp mide ${imagen.naturalWidth}x${imagen.naturalHeight} ` +
                        `y el recorte necesita al menos ${RECORTE_ESCENARIO.derecha}x${RECORTE_ESCENARIO.abajo}.`
                    );
                }

                ctx.clearRect(0, 0, ANCHO, ALTO);
                // Rectángulo fuente (sx, sy, sw, sh) => solo esos píxeles exactos;
                // rectángulo destino en (0, 0) con el mismo tamaño => sin escalar.
                ctx.drawImage(
                    imagen,
                    RECORTE_ESCENARIO.izquierda, RECORTE_ESCENARIO.arriba, ANCHO, ALTO,
                    0, 0, ANCHO, ALTO
                );
            }

            // Redibuja en cuanto el gestor termina de cargar el escenario,
            // o cuando la zona 1 queda lista.
            window.addEventListener('sprites:cargado', (evento) => {
                if (evento.detail.nombre === NOMBRE_ESCENARIO) dibujarEscenario();
            });
            window.addEventListener('sprites:zonaLista', (evento) => {
                if (evento.detail.sprites.includes(NOMBRE_ESCENARIO)) dibujarEscenario();
            });

            // Verificación contra las medidas ya configuradas del juego: el
            // recorte debe coincidir con el cuadro superior del contenedor.
            const contenedor = document.querySelector('.contenedor-medida');
            const divisoria = document.querySelector('.linea-divisoria');
            if (contenedor && divisoria &&
                (contenedor.clientWidth !== ANCHO || divisoria.offsetTop !== ALTO)) {
                console.warn(
                    `El recorte del escenario (${ANCHO}x${ALTO}) no coincide con el cuadro ` +
                    `superior (${contenedor.clientWidth}x${divisoria.offsetTop}).`
                );
            }

            // Activa la zona 1 para que el gestor cargue sus sprites. Si algún
            // archivo de la zona faltara, el error se anota pero el escenario se
            // dibuja igual en cuanto termina de cargar (evento sprites:cargado).
            window.GestorSprites.entrarEnZona(1).catch((error) => {
                console.warn(`Zona 1 incompleta: ${error.message}`);
            });
        })();
    </script>
</body>
</html>
