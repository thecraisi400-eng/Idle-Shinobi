<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensiones Específicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Fondo gris oscuro para que el recuadro negro destaque */
            background-color: #333333; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-medida {
            width: 392px;
            height: 687px;
            background-color: #000000;
            position: relative;
            /* Sombra sutil para diferenciarlo bien del fondo de la página */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .linea-divisoria {
            position: absolute;
            top: 344px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ffffff;
            z-index: 2;
        }

        .sprite-cuadro-superior {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            width: 392px;
            height: 344px;
            image-rendering: auto;
        }

        .estado-carga-sprites {
            position: absolute;
            right: 10px;
            bottom: 10px;
            left: 10px;
            z-index: 3;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            padding: 10px;
            pointer-events: none;
        }

        .estado-carga-sprites strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="contenedor-medida">
        <!-- La línea que divide horizontalmente a los 344px de alto -->
        <canvas class="sprite-cuadro-superior" id="spriteCuadroSuperior" width="392" height="344"></canvas>
        <div class="linea-divisoria"></div>
        <div class="estado-carga-sprites" id="estadoCargaSprites" aria-live="polite">
            <strong>Cargando recursos gráficos...</strong>
            Preparando escenarios y personajes.
        </div>
    </div>

    <script>
        const SPRITE_SHEET_GROUPS = {
            escenarios: [
                { id: 'escenarios1', src: 'assets/sprites/escenarios1.webp', width: 2048, height: 2048 },
                { id: 'escenarios2', src: 'assets/sprites/escenarios2.webp', width: 2048, height: 2048 }
            ],
            personajes: [
                { id: 'personaje1', src: 'assets/sprites/personaje1.webp', width: 2048, height: 2048 },
                { id: 'personaje2', src: 'assets/sprites/personaje2.webp', width: 2048, height: 2048 },
                { id: 'personaje3', src: 'assets/sprites/personaje3.webp', width: 2048, height: 2048 }
            ]
        };

        const spriteSheetManager = (() => {
            const loadedSheets = new Map();
            const loadingGroups = new Map();

            const loadSheet = (sheet) => new Promise((resolve, reject) => {
                if (loadedSheets.has(sheet.id)) {
                    resolve(loadedSheets.get(sheet.id));
                    return;
                }

                const image = new Image(sheet.width, sheet.height);
                image.decoding = 'async';
                image.loading = 'eager';

                image.addEventListener('load', async () => {
                    if (typeof image.decode === 'function') {
                        try {
                            await image.decode();
                        } catch (error) {
                            console.warn(`La hoja ${sheet.id} cargó, pero no pudo decodificarse de forma anticipada.`, error);
                        }
                    }

                    const loadedSheet = { ...sheet, image };
                    loadedSheets.set(sheet.id, loadedSheet);
                    resolve(loadedSheet);
                }, { once: true });

                image.addEventListener('error', () => {
                    reject(new Error(`No se pudo cargar la hoja de sprites: ${sheet.src}`));
                }, { once: true });

                image.src = sheet.src;
            });

            const loadGroup = (groupName) => {
                if (!SPRITE_SHEET_GROUPS[groupName]) {
                    return Promise.reject(new Error(`El grupo de sprites "${groupName}" no existe.`));
                }

                if (loadingGroups.has(groupName)) {
                    return loadingGroups.get(groupName);
                }

                const groupLoad = Promise.all(SPRITE_SHEET_GROUPS[groupName].map(loadSheet))
                    .finally(() => loadingGroups.delete(groupName));

                loadingGroups.set(groupName, groupLoad);
                return groupLoad;
            };

            const getSheet = (sheetId) => loadedSheets.get(sheetId) || null;
            const hasSheet = (sheetId) => loadedSheets.has(sheetId);

            return {
                loadGroup,
                getSheet,
                hasSheet
            };
        })();

        window.spriteSheetManager = spriteSheetManager;

        const SPRITE_CUADRO_SUPERIOR = {
            sheetId: 'escenarios1',
            sourceX: 10,
            sourceY: 8,
            sourceWidth: 403 - 10,
            sourceHeight: 353 - 8,
            targetX: 0,
            targetY: 0
        };

        const drawTopBoxSprite = () => {
            const canvas = document.getElementById('spriteCuadroSuperior');
            const spriteSheet = spriteSheetManager.getSheet(SPRITE_CUADRO_SUPERIOR.sheetId);

            if (!canvas || !spriteSheet) return;

            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.drawImage(
                spriteSheet.image,
                SPRITE_CUADRO_SUPERIOR.sourceX,
                SPRITE_CUADRO_SUPERIOR.sourceY,
                SPRITE_CUADRO_SUPERIOR.sourceWidth,
                SPRITE_CUADRO_SUPERIOR.sourceHeight,
                SPRITE_CUADRO_SUPERIOR.targetX,
                SPRITE_CUADRO_SUPERIOR.targetY,
                SPRITE_CUADRO_SUPERIOR.sourceWidth,
                SPRITE_CUADRO_SUPERIOR.sourceHeight
            );
        };

        const updateSpriteLoadStatus = (message, isError = false) => {
            const statusElement = document.getElementById('estadoCargaSprites');
            if (!statusElement) return;

            statusElement.innerHTML = `<strong>${isError ? 'Error de carga' : 'Recursos gráficos'}</strong>${message}`;
            statusElement.style.borderColor = isError ? '#ef4444' : 'rgba(255, 255, 255, 0.2)';
        };

        const prepareInitialSpriteSheets = async () => {
            try {
                updateSpriteLoadStatus('Cargando escenarios iniciales...');
                await spriteSheetManager.loadGroup('escenarios');
                drawTopBoxSprite();

                updateSpriteLoadStatus('Escenarios listos. Preparando personajes y enemigos...');
                await spriteSheetManager.loadGroup('personajes');

                updateSpriteLoadStatus('Todas las hojas de sprites están listas para usarse.');
            } catch (error) {
                console.error(error);
                updateSpriteLoadStatus('No se pudieron preparar todas las hojas. Revisa que los archivos .webp estén disponibles en assets/sprites/.', true);
            }
        };

        prepareInitialSpriteSheets();
    </script>

</body>
</html>
